name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (server, crates)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: renewal
          POSTGRES_PASSWORD: renewal
          POSTGRES_DB: renewal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U renewal -d renewal"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://renewal:renewal@localhost:5432/renewal
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --exclude renewal-desktop --all-targets 2>&1 | tee clippy.log
      - name: Surface clippy errors as annotations
        if: failure()
        shell: bash
        # One annotation with the first errors, readable from the run page without signing in.
        run: |
          msg=$( (grep -E "^(error|warning)(\[|:)" -A6 clippy.log || tail -n 60 clippy.log) | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' )
          echo "::error title=clippy::${msg:-no error lines captured}"
      - run: cargo test --workspace --exclude renewal-desktop

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  desktop:
    name: Windows installer (Tauri)
    runs-on: windows-latest
    needs: [rust, frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run tauri build
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: renewal-manager-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
