[package]
name = "renewal-core"
description = "Pure domain logic: roles, statuses, state machines, expiry engine. No IO."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Derive `specta::Type` on public enums so the desktop app can export them to TypeScript.
specta = ["dep:specta"]

[dependencies]
serde.workspace = true
strum.workspace = true
chrono.workspace = true
thiserror.workspace = true
uuid.workspace = true
specta = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
