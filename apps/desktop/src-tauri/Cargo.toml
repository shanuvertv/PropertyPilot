[package]
name = "renewal-desktop"
description = "Tauri shell for the Rental Contract Renewal Management System (Windows now, Android later)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "renewal_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Secure store for the API URL + session token: Windows Credential Manager now;
# enable `android-native-keyring-store` in the Android target when that build is added.
keyring.workspace = true
